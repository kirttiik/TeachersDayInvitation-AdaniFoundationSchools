<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Teachers Day Invitation Adani Foundation</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div class="main-container">
        <!-- Top Image Placeholder -->
        <img id="top-logo" src="top-image.png" alt="Top Image">
        
        <div id="scratch">
        <div id="door-container">
            <div class="door door-left"></div>
            <div class="door door-right"></div>
            <div class="click-btn">𝑻𝒂𝒑</div>
        </div>
        <img src="winning-card.jpeg" alt="Hidden Image">
        <canvas></canvas>
    </div>

    <!-- Actions Container (appears below after scratching) -->
    <div class="actions-container" id="actions-container">
        <!-- Date and Time Row -->
        <div class="date-time-row">
            <div class="info-pill">
                <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" style="margin-right: 6px;"><rect x="3" y="4" width="18" height="18" rx="2" ry="2"></rect><line x1="16" y1="2" x2="16" y2="6"></line><line x1="8" y1="2" x2="8" y2="6"></line><line x1="3" y1="10" x2="21" y2="10"></line></svg>
                07 Sept 2026
            </div>
            <div class="info-pill">
                <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" style="margin-right: 6px;"><circle cx="12" cy="12" r="10"></circle><polyline points="12 6 12 12 16 14"></polyline></svg>
                3:00 PM
            </div>
        </div>

        <a id="calendar-btn" href="data:text/calendar;charset=utf-8,BEGIN%3AVCALENDAR%0AVERSION%3A2.0%0ABEGIN%3AVEVENT%0ADTSTART%3A20260907T150000%0ADTEND%3A20260907T170000%0ASUMMARY%3ATeachers%20Day%20Event%20-%20Adani%20Foundation%0ADESCRIPTION%3AJoin%20us%20for%20the%20Teachers%20Day%20celebration%21%0AEND%3AVEVENT%0AEND%3AVCALENDAR" download="TeachersDayEvent.ics">
            ADD TO CALENDAR
        </a>
    </div>

    </div>

    <!-- Celebration Music Placeholder -->
    <audio id="celebration-music" src="music.mp3"></audio>

    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <script src="script.js"></script>
</body>

</html>
